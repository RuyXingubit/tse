[project]
name = "tse-coleta"
version = "0.1.0"
description = "Coleta e preservação dos arquivos de urna e resultados públicos do TSE (1º turno 2026)"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
